# CI/CD
#   CI：push 到 main 或開 PR 時，都會跑型別檢查（typecheck）+ 產生靜態網站（generate），有錯就失敗
#   CD：只有 push 到 main（或手動執行）才會部署到 GitHub Pages；PR 只檢查、不部署
# 第一次使用前：repo 的 Settings → Pages → Build and deployment → Source 要選「GitHub Actions」
name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 同一個分支有新的 push 就取消舊的檢查；部署則不中斷，避免網站停在部署一半的狀態
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Generate
        run: npm run generate

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .output/public

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
