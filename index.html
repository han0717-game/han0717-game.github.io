<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Han Game</title>
    <meta name="description"
        content="">
    <!-- 分享預覽（FB、Threads、LINE 等貼上網址時顯示的標題、說明、圖片；網址要用完整網址）
         改了 og-image.jpg 之後，FB 要到「分享偵錯工具」重新擷取才會更新預覽圖 -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="">
    <meta property="og:url" content="https://han45678.github.io/HanWorks/trueHobo/1/">
    <meta property="og:title" content="街友本色 I - 煙屁股大作戰 | True Hobo I: Butt Brawl">
    <meta property="og:description" content="在台灣霓虹暗巷裡挑一根菸屁股，壓住猛吸、適時放開控溫，60 秒內抽出最高分！你能抽贏我嗎？">
    <meta property="og:image" content="https://han0717-game/images/og-image.jpg">
    <!-- og-image.jpg：直式 1080x1350（4:5），下方有遊戲網址的 QR code；結算畫面下載的戰績圖也用這張當底圖（js/share.js） -->
    <meta property="og:image:width" content="1080">
    <meta property="og:image:height" content="1350">
    <meta property="og:locale" content="zh_TW">
    <meta name="twitter:card" content="summary_large_image">
    <!-- AdSense 網站驗證（meta 標記 + 程式碼片段都放在 head，Google 只認 head 裡的） -->
    <meta name="google-adsense-account" content="ca-pub-9815906908978353">
    <!-- 廣告腳本被擋（例如裝了擋廣告外掛）時記下來，等廣告列建好再收起 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9815906908978353"
        crossorigin="anonymous" onerror="window.adScriptBlocked = true; if (window.hideAdBar) hideAdBar();"></script>
    <!-- 分頁小圖示：撿來的菸屁股（濾嘴 + 一小截皺菸紙 + 燒焦的頭）；內嵌，免得瀏覽器去抓不存在的 favicon.ico -->
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><g transform='rotate(-32 50 50)' stroke='%23000' stroke-width='5' stroke-linejoin='round'><rect x='8' y='36' width='46' height='28' rx='3' fill='%23d9893a'/><path d='M54 37 H78 L84 43 L79 50 L85 57 L78 63 H54 Z' fill='%23ece6d8'/><path d='M76 37 L84 43 L79 50 L85 57 L78 63 H71 L73 50 Z' fill='%23332b26' stroke='none'/></g><g transform='rotate(-32 50 50)' fill='%23f6c27a'><circle cx='20' cy='45' r='3'/><circle cx='32' cy='55' r='3'/><circle cx='44' cy='45' r='3'/></g></svg>">
    <!-- PWA：可以「加到主畫面」安裝成 App（App 名稱、圖示、全螢幕直向見 manifest）；一定要連網才能玩，沒網路時顯示無法連線（見 sw.js）
         manifest 和 icons/ 的圖示不加 ?v=版本號：它們由瀏覽器自己定期檢查更新，不是遊戲載入時讀的檔案 -->
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#080a0f">
    <!-- iPhone / iPad 加到主畫面：iOS 用這個圖示和名稱，開啟後不顯示 Safari 網址列 -->
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="街友本色 I">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <!-- Phaser 3 -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Google Fonts：中文 Noto Serif TC、英文 Noto Serif（全站統一） -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700;900&family=Noto+Serif:wght@400;700;900&display=swap"
        rel="stylesheet">
    <script>
    </script>
</head>
